<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영어 배틀 아레나 3D</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0b1020;--panel:#151d32;--line:#34415f;--text:#f4f7ff;--mut:#a8b5d1;--blue:#647dff;--green:#20c997}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans KR",sans-serif}
.scr{max-width:1000px;margin:auto;padding:18px}.hide{display:none!important}h1{font-size:28px;margin:8px 0}h2{margin:4px 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.mut{color:var(--mut)}.small{font-size:13px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0d1426;color:white;font-size:16px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
button{border:0;border-radius:10px;padding:12px 14px;background:var(--blue);color:white;font-weight:800;font-size:15px;cursor:pointer;margin:4px 0}
button:disabled{opacity:.45;cursor:not-allowed}.alt{background:#26334f;border:1px solid var(--line)}.opt{display:block;width:100%;text-align:left;background:#202c46;border:1px solid #3b4a6c}.opt.sel{border:2px solid #91a3ff;background:#2a3960}
#arena{position:relative;width:100%;height:min(70vh,680px);min-height:380px;border:1px solid #435276;border-radius:16px;overflow:hidden;background:#080d18}
#view{width:100%;height:100%;display:block}#hud{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none;text-shadow:0 2px 5px #000;font-weight:900}
#help{position:absolute;bottom:10px;left:10px;background:#0b1020cc;padding:8px 12px;border-radius:10px;font-size:12px;pointer-events:none}
#toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:#101a30eF;padding:10px 16px;border:1px solid #7185ff;border-radius:12px;font-weight:800;pointer-events:none;white-space:nowrap}
#quizbox button{margin:5px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
#players>div{padding:8px;border-bottom:1px solid var(--line)}
#endlist>div{padding:9px;border-bottom:1px solid var(--line)}
@media(max-width:600px){.scr{padding:10px}h1{font-size:23px}#arena{height:65vh;min-height:360px}.row{flex-wrap:wrap}}
</style>
</head>
<body>
<section id="home" class="scr">
<h1>⚔️ 영어 배틀 아레나 <span style="color:#91a3ff">3D</span></h1>
<p class="mut">영어 퀴즈로 무기를 고르고, 거대한 3D 전장에서 능력을 겨뤄 보세요!</p>
<div class="card">
<label>닉네임<input id="nick" maxlength="10" placeholder="예: 번개용사"></label>
<div class="row"><button id="create">방 만들기</button><div><input id="roomcode" maxlength="4" placeholder="방 코드 4자리"></div><button id="join" class="alt">입장</button></div>
<p id="status" class="mut small">연결 준비 중…</p>
</div>
<p class="mut small">조작: WASD 이동 · 마우스 조준 · 클릭/Space 공격 · E 능력 · Q 궁극기 · Shift 대시 · 1~4 퀴즈 선택</p>
</section>
<section id="lobby" class="scr hide">
<h2>대기실 · 코드 <b id="codeLabel"></b></h2>
<div class="card"><b>접속 플레이어</b><div id="players"></div></div>
<div class="card"><b>캐릭터 선택</b><div id="chars" class="grid"></div></div>
<div class="card"><b>전장 선택</b><div id="maps" class="grid"></div></div>
<button id="start" style="width:100%">🎮 게임 시작</button><button id="leave" class="alt">나가기</button>
</section>
<section id="quiz" class="scr hide"><h2>🧠 무기 선택 퀴즈</h2><div id="quizbox" class="card"></div></section>
<section id="game" class="scr hide">
<div id="arena"><canvas id="view"></canvas><div id="hud"><span id="hp">❤️ 100</span><span id="timer">⏱ 90</span><span id="weapon">🗡️ 단검</span><span id="ult">궁극기 0%</span></div><div id="toast" class="hide"></div><div id="help">WASD 이동 · 클릭 공격 · E 능력 · Q 궁극기 · Shift 대시</div></div>
<div class="row"><button id="skill">E 능력 사용</button><button id="ultimate" class="alt">Q 궁극기</button><button id="back" class="alt">나가기</button></div>
</section>
<section id="result" class="scr hide"><h2>🏆 전투 결과</h2><div class="card" id="endlist"></div><button id="again" style="width:100%">대기실로 돌아가기</button></section>
<script>
(()=>{
const $=id=>document.getElementById(id), rand=n=>Math.floor(Math.random()*n), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const questions=[
["‘library’의 뜻은?","도서관",["병원","학교","시장"]],["‘hospital’의 뜻은?","병원",["도서관","공원","가게"]],
["I ___ going to visit my grandma.","am",["is","are","do"]],["‘weekend’의 뜻은?","주말",["평일","생일","방학"]],
["She ___ a book now.","is reading",["reads","read","are reading"]],["‘beautiful’의 뜻은?","아름다운",["무서운","느린","무거운"]],
["I can ___ a bike.","ride",["rides","riding","to rides"]],["‘museum’의 뜻은?","박물관",["미술 도구","경찰서","소방서"]],
["How’s the weather? — It’s ___.","sunny",["Monday","green","tall"]],["‘Turn left.’의 뜻은?","왼쪽으로 도세요",["오른쪽으로 도세요","똑바로 가세요","멈추세요"]]
];
const weapons={dagger:{name:"단검",damage:14,rate:380,speed:30,color:0xd9e2f2},sword:{name:"검",damage:28,rate:550,speed:36,color:0xe5e7eb},bow:{name:"활",damage:22,rate:700,speed:58,color:0xffc857},blaster:{name:"에너지 블래스터",damage:12,rate:180,speed:70,color:0xff6b8a},staff:{name:"마법 지팡이",damage:25,rate:850,speed:25,color:0xb69cff}};
const abilities={
flame:["🔥 화염 폭발","주변에 불꽃 12개 발사",0xff713d],wind:["💨 질풍","빠르게 돌진하며 잠시 보호",0x8de8ff],
heal:["🌿 자연 치유","체력을 35 회복",0x50e39a],ice:["❄️ 빙결 파편","얼음 탄환 8개 발사",0x8deaff],
thunder:["⚡ 번개 연쇄","가까운 적에게 번개 공격",0xffed68],shadow:["🌑 그림자 도약","조준 방향으로 순간 이동",0x9b82ff],
earth:["⛰️ 대지 파동","넓은 범위에 충격파",0xc6a27d],water:["🌊 물의 장막","잠시 피해를 막는 방패",0x5bc8ff],
poison:["☠️ 독 구름","주변 적에게 지속 피해",0x9ee34f],light:["✨ 섬광 난사","빛 탄환 10개 발사",0xfff4a6],
meteor:["☄️ 유성 낙하","조준 지점에 강력한 폭발",0xff8c70],clone:["👥 환영 분신","짧은 시간 이동 속도 증가",0xd6b6ff],
gravity:["🌀 중력장","주변 적을 끌어당기는 장",0x9a8bff],sonic:["🔊 음파","전방 넓은 부채꼴 공격",0x6ce6d6],
crystal:["💎 수정 창","강력한 관통 탄환",0x82f5ed],dragon:["🐉 용의 숨결","전방 화염 브레스",0xffa34d],
storm:["🌪️ 폭풍 소환","주변에 회오리 공격",0xa8d7ff],star:["🌟 별빛 강림","하늘에서 별 탄환이 쏟아짐",0xffe18a]
};
const characters=["🔥 화염술사","💨 질풍검객","🌿 숲의 수호자","❄️ 서리 마법사","⚡ 번개 전사","🌑 그림자 암살자","🌊 파도술사","✨ 빛의 기사","⛰️ 대지 거인","☠️ 독의 연금술사","🐉 용기사","🌟 별의 현자"];
const maps=[
{name:"초원 왕국",size:220,ground:0x315d43,sky:0x91bce8,theme:"forest",trees:75},
{name:"얼음 수정 협곡",size:250,ground:0x668da5,sky:0x9bc8e8,theme:"ice",trees:42},
{name:"용암 분화구",size:230,ground:0x49302d,sky:0x9b5544,theme:"lava",trees:35},
{name:"사막 유적",size:280,ground:0xc3a66b,sky:0xe5bd7b,theme:"desert",trees:60},
{name:"하늘섬 군도",size:260,ground:0x557c8e,sky:0x85c9ef,theme:"sky",trees:48},
{name:"네온 메트로폴리스",size:300,ground:0x202b49,sky:0x182044,theme:"city",trees:90},
{name:"마법의 버섯 숲",size:240,ground:0x315044,sky:0x6d9e9c,theme:"magic",trees:85},
{name:"고대 신전",size:320,ground:0x8d806c,sky:0x9bb2bd,theme:"temple",trees:100},
{name:"폭풍 해안",size:300,ground:0x477b83,sky:0x668da5,theme:"storm",trees:70},
{name:"수정 동굴",size:210,ground:0x343d60,sky:0x252a48,theme:"crystal",trees:100}
];
let peer=null,conn=null,host=false,roomCode="",players={},myId="",phase="home",chosenChar=0,mapIndex=0,weapon="dagger",ability="flame",hp=100,kills=0,ult=0,alive=true,inv=0,lastShot=0,lastSkill=0,startAt=0,remaining=90;
let scene,camera,renderer,clock,ground,playerMesh,world=[],projectiles=[],effects=[],remoteMeshes={},keys={},mouse={x:0,y:0,down:false},player={x:0,z:0,y:0},aim=0;
const send=(type,data)=>{if(host){handleMessage(myId,type,data);Object.values(players).forEach(p=>p.conn?.send({type,data,from:myId}))}else conn?.send({type,data})};
function show(id){document.querySelectorAll(".scr").forEach(x=>x.classList.toggle("hide",x.id!==id));phase=id}
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hide");clearTimeout(toast.timer);toast.timer=setTimeout(()=>$("toast").classList.add("hide"),1700)}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function quiz(){const q=questions[rand(questions.length)],opts=shuffle([q[1],...q[2]]);$("quizbox").innerHTML=`<div style="font-size:20px;font-weight:900;margin-bottom:12px">${q[0]}</div>`;opts.forEach((v,i)=>{let b=document.createElement("button");b.className="opt";b.textContent=(i+1)+") "+v;b.onclick=()=>{if(v===q[1]){weapon=["sword","bow","blaster","staff"][rand(4)];toast("정답! "+weapons[weapon].name+" 선택")}else{weapon="dagger";toast("오답! 단검으로 시작")}setTimeout(()=>{show("game");startGame()},700)};$("quizbox").appendChild(b)})}
function buildLobby(){
$("codeLabel").textContent=roomCode;$("players").innerHTML="";
Object.values(players).forEach(p=>{let d=document.createElement("div");d.textContent=(p.host?"👑 ":"")+p.name;$("players").appendChild(d)});
$("chars").innerHTML="";characters.forEach((c,i)=>{let b=document.createElement("button");b.className="opt"+(i===chosenChar?" sel":"");b.textContent=c;b.onclick=()=>{chosenChar=i;send("char",i);buildLobby()};$("chars").appendChild(b)});
$("maps").innerHTML="";maps.forEach((m,i)=>{let b=document.createElement("button");b.className="opt"+(i===mapIndex?" sel":"");b.textContent=`${m.name} · ${m.size}×${m.size}`;b.onclick=()=>{if(host){mapIndex=i;send("map",i);buildLobby()}};b.disabled=!host;$("maps").appendChild(b)});
$("start").style.display=host?"block":"none";
}
function makePeer(code,isHost){return new Promise((resolve,reject)=>{
let p=isHost?new Peer("eb3d-"+code):new Peer();let timer=setTimeout(()=>reject(Error("연결 시간 초과")),10000);
p.on("open",id=>{clearTimeout(timer);peer=p;myId=id;resolve()});p.on("error",reject);
if(isHost){p.on("connection",c=>{c.on("open",()=>{players[c.peer]={id:c.peer,name:"친구",conn:c,char:0,x:0,z:0,hp:100,host:false};c.send({type:"welcome",code,players:Object.values(players).map(publicPlayer),mapIndex})});c.on("data",m=>{handleMessage(c.peer,m.type,m.data);Object.values(players).filter(q=>q.id!==c.peer).forEach(q=>q.conn?.send({type:m.type,data:m.data,from:c.peer}))});c.on("close",()=>{delete players[c.peer];broadcastPlayers()})})}
else{p.on("open",()=>{})}
})}
function publicPlayer(p){return {id:p.id,name:p.name,char:p.char,x:p.x,z:p.z,hp:p.hp,host:p.host}}
function broadcastPlayers(){if(host)Object.values(players).forEach(p=>p.conn?.send({type:"players",data:Object.values(players).map(publicPlayer)}))}
function handleMessage(from,type,data){
if(type==="welcome"&&!host){roomCode=data.code;players=Object.fromEntries((data.players||[]).map(p=>[p.id,{...p}]));mapIndex=data.mapIndex||0;players[myId]={id:myId,name:$("nick").value||"용사",char:chosenChar,x:0,z:0,hp:100,host:false};conn?.send({type:"join",data:{name:$("nick").value||"용사",char:chosenChar},from:myId});show("lobby");buildLobby();return}
if(type==="join"&&host){if(players[from]){players[from].name=String(data?.name||"친구").slice(0,10);players[from].char=data?.char||0}broadcastPlayers();buildLobby();return}
if(type==="players"){(data||[]).forEach(p=>{if(!players[p.id])players[p.id]={...p};else Object.assign(players[p.id],p)});return}
if(type==="char"){if(players[from])players[from].char=data}
if(type==="map"&&host===false){mapIndex=data;buildLobby()}
if(type==="start"){show("quiz");quiz()}
if(type==="state"&&from!==myId){if(!players[from])players[from]={id:from,name:"친구",char:0};Object.assign(players[from],data);updateRemote(from)}
if(type==="shot"&&from!==myId)spawnProjectile(data.x,data.z,data.dx,data.dz,data.damage,data.color,from);
if(type==="skill"&&from!==myId)remoteSkill(data);
if(type==="result"){Object.assign(players,data);if(phase==="game")finish()}
if(type==="back"){show("lobby");buildLobby()}
}
async function enterRoom(code,isHost){
try{roomCode=code;host=isHost;players={};const nick=$("nick").value.trim()||"용사";await makePeer(code,isHost);
if(isHost){players[myId]={id:myId,name:nick,char:chosenChar,x:0,z:0,hp:100,host:true};show("lobby");buildLobby();broadcastPlayers()}
else{conn=peer.connect("eb3d-"+code,{reliable:true});conn.on("open",()=>{});conn.on("data",m=>handleMessage(m.from||"host",m.type,m.data));conn.on("close",()=>toast("방 연결이 끊어졌어요"))}
}catch(e){$("status").textContent="연결 실패: "+e.message}}
$("create").onclick=()=>enterRoom(Math.random().toString(36).slice(2,6),true);
$("join").onclick=()=>{let c=$("roomcode").value.trim().toLowerCase();if(c.length!==4)return $("status").textContent="4자리 코드를 입력하세요.";enterRoom(c,false)};
$("start").onclick=()=>{if(!host)return;send("start",{});show("quiz");quiz()};
$("leave").onclick=$("back").onclick=()=>{peer?.destroy();show("home")};
$("again").onclick=()=>{if(host){send("back",{});show("lobby");buildLobby()}else toast("방장이 대기실로 돌아갈 때까지 기다려 주세요")};
function init3D(){
if(renderer)return;
const canvas=$("view");renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,1,.1,1200);clock=new THREE.Clock();
scene.add(new THREE.HemisphereLight(0xddeeff,0x273322,1.6));let sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(70,100,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=new THREE.MeshStandardMaterial({color:0x315d43,roughness:.9});ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
playerMesh=makePlayer(0x6f8cff);scene.add(playerMesh);resize();window.addEventListener("resize",resize);
}
function resize(){if(!renderer)return;let r=$("arena").getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
function makePlayer(color){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.8,1.2,4,8),new THREE.MeshStandardMaterial({color,roughness:.45}));body.position.y=1.25;body.castShadow=true;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.48,16,12),new THREE.MeshStandardMaterial({color:0xffd3ad}));head.position.y=2.35;head.castShadow=true;g.add(head);let ring=new THREE.Mesh(new THREE.TorusGeometry(1.05,.07,8,24),new THREE.MeshBasicMaterial({color:0xffffff}));ring.rotation.x=Math.PI/2;ring.position.y=.1;g.add(ring);return g}
function buildWorld(){
init3D();world.forEach(o=>scene.remove(o));world=[];projectiles.forEach(p=>scene.remove(p.mesh));projectiles=[];effects.forEach(e=>scene.remove(e.mesh));effects=[];
let m=maps[mapIndex],size=m.size;ground.geometry.dispose();ground.geometry=new THREE.PlaneGeometry(size,size);ground.material.color.setHex(m.ground);scene.background=new THREE.Color(m.sky);
const grid=new THREE.GridHelper(size,Math.round(size/5),0xffffff,0xffffff);grid.material.opacity=.12;grid.material.transparent=true;scene.add(grid);world.push(grid);
for(let i=0;i<m.trees;i++){let x=(Math.random()-.5)*(size-18),z=(Math.random()-.5)*(size-18),h=2+Math.random()*5;let geo,mat;
if(m.theme==="ice"||m.theme==="crystal"){geo=new THREE.OctahedronGeometry(1.5+Math.random()*2);mat=new THREE.MeshStandardMaterial({color:m.theme==="ice"?0x9deaff:0x8c8cff,roughness:.25,metalness:.25})}
else if(m.theme==="city"||m.theme==="temple"){geo=new THREE.BoxGeometry(2+Math.random()*3,h,2+Math.random()*3);mat=new THREE.MeshStandardMaterial({color:m.theme==="city"?[0x384d75,0x6c5c9c,0x24485b][rand(3)]:0xb7a98b})}
else{geo=new THREE.ConeGeometry(1.5+Math.random()*1.5,h,7);mat=new THREE.MeshStandardMaterial({color:m.theme==="desert"?0x967044:m.theme==="lava"?0x6a3730:m.theme==="magic"?0x9c5fa8:0x235d3c})}
let o=new THREE.Mesh(geo,mat);o.position.set(x,h/2,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);world.push(o)}
player.x=0;player.z=0;playerMesh.position.set(0,0,0);
}
function startGame(){hp=100;kills=0;ult=0;alive=true;inv=2;lastSkill=0;remaining=90;startAt=performance.now();buildWorld();toast(maps[mapIndex].name+" 전투 시작!");if(!renderer.setAnimationLoop){}renderer.setAnimationLoop(frame)}
function spawnProjectile(x,z,dx,dz,damage,color,owner){let mesh=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.45}));mesh.position.set(x,1.4,z);scene.add(mesh);projectiles.push({mesh,dx,dz,damage,owner,life:2.6})}
function attack(){let now=performance.now();let w=weapons[weapon];if(now-lastShot<w.rate||!alive)return;lastShot=now;let dx=Math.sin(aim),dz=Math.cos(aim);let speed=w.speed;spawnProjectile(player.x+dx*1.4,player.z+dz*1.4,dx*speed,dz*speed,w.damage,w.color,myId);send("shot",{x:player.x+dx*1.4,z:player.z+dz*1.4,dx:dx*speed,dz:dz*speed,damage:w.damage,color:w.color})}
function useAbility(){let now=performance.now();if(now-lastSkill<6500||!alive)return;lastSkill=now;let key=ability;let data={key,x:player.x,z:player.z,aim};special(key);send("skill",data);toast(abilities[key][0]+" 발동!")}
function special(key){
if(key==="heal"){hp=Math.min(100,hp+35);return}
if(key==="wind"||key==="shadow"||key==="clone"){let d=key==="shadow"?30:18;player.x+=Math.sin(aim)*d;player.z+=Math.cos(aim)*d;inv=1.2;return}
if(key==="water"){inv=3;return}
if(key==="gravity"||key==="earth"||key==="poison"||key==="storm"){areaEffect(key);return}
let n=key==="flame"?12:key==="ice"?8:key==="light"?10:key==="sonic"?7:key==="dragon"?9:key==="star"?14:5;
let spread=key==="sonic"?1.3:Math.PI*2;
for(let i=0;i<n;i++){let a=aim-spread/2+(n===1?0:i*spread/(n-1));let speed=key==="crystal"?85:50;spawnProjectile(player.x,player.z,Math.sin(a)*speed,Math.cos(a)*speed,key==="meteor"?45:18,abilities[key][2],myId)}
}
function areaEffect(key){let color=abilities[key][2];let geo=new THREE.TorusGeometry(key==="earth"?9:13,.35,8,48);let mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));mesh.rotation.x=Math.PI/2;mesh.position.set(player.x,.5,player.z);scene.add(mesh);effects.push({mesh,life:1.2});if(key==="earth")inv=1}
function remoteSkill(d){if(!d)return;let old={...player};if(d.key==="heal"||d.key==="water")return;let n=d.key==="flame"?12:8;for(let i=0;i<n;i++){let a=d.aim+i*Math.PI*2/n;spawnProjectile(d.x,d.z,Math.sin(a)*42,Math.cos(a)*42,16,abilities[d.key]?.[2]||0xffffff,"remote")}}
function updateRemote(id){let p=players[id];if(!p)return;if(!remoteMeshes[id]){remoteMeshes[id]=makePlayer(0xff8a65);scene.add(remoteMeshes[id])}remoteMeshes[id].position.set(p.x||0,0,p.z||0)}
function frame(){
if(phase!=="game")return;let dt=Math.min(clock.getDelta(),.05);let speed=24;
let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dz=(keys.KeyS?1:0)-(keys.KeyW?1:0),len=Math.hypot(dx,dz);
if(alive&&len){player.x+=dx/len*speed*dt;player.z+=dz/len*speed*dt}
let half=maps[mapIndex].size/2-5;player.x=clamp(player.x,-half,half);player.z=clamp(player.z,-half,half);
playerMesh.position.set(player.x,0,player.z);playerMesh.rotation.y=aim;
camera.position.lerp(new THREE.Vector3(player.x+Math.sin(aim)*-17,18+Math.abs(Math.sin(performance.now()/700))*1.2,player.z+Math.cos(aim)*-22),.09);camera.lookAt(player.x,0,player.z);
if(mouse.down||keys.Space)attack();
for(let i=projectiles.length-1;i>=0;i--){let p=projectiles[i];p.mesh.position.x+=p.dx*dt;p.mesh.position.z+=p.dz*dt;p.life-=dt;if(p.life<=0||Math.abs(p.mesh.position.x)>half+10||Math.abs(p.mesh.position.z)>half+10){scene.remove(p.mesh);projectiles.splice(i,1)}}
for(let i=effects.length-1;i>=0;i--){let e=effects[i];e.life-=dt;e.mesh.scale.multiplyScalar(1+dt*1.5);if(e.life<=0){scene.remove(e.mesh);effects.splice(i,1)}}
if(performance.now()-startAt>90000){finish();return}
remaining=Math.max(0,90-Math.floor((performance.now()-startAt)/1000));
$("hp").textContent="❤️ "+Math.round(hp);$("timer").textContent="⏱ "+remaining;$("weapon").textContent="⚔️ "+weapons[weapon].name+" · "+abilities[ability][0];$("ult").textContent="궁극기 "+Math.floor(ult)+"%";
if(alive)ult=Math.min(100,ult+dt*2.5);
if(performance.now()%180<30)send("state",{x:player.x,z:player.z,hp,char:chosenChar});
renderer.render(scene,camera);
}
function useUlt(){if(ult<100||!alive)return;ult=0;for(let i=0;i<24;i++){let a=i*Math.PI*2/24;spawnProjectile(player.x,player.z,Math.sin(a)*58,Math.cos(a)*58,30,0xffdf70,myId)}toast("🌟 궁극기 발동!")}
function finish(){if(phase!=="game")return;phase="result";renderer?.setAnimationLoop(null);show("result");$("endlist").innerHTML=`<b>${$("nick").value||"용사"}</b><p>사용 무기: ${weapons[weapon].name}</p><p>선택 능력: ${abilities[ability][0]}</p><p>남은 체력: ${Math.max(0,Math.round(hp))}</p>`}
$("skill").onclick=useAbility;$("ultimate").onclick=useUlt;
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;keys[e.code]=true;if(e.code==="KeyE")useAbility();if(e.code==="KeyQ")useUlt();if(e.code==="ShiftLeft"||e.code==="ShiftRight"){player.x+=Math.sin(aim)*12;player.z+=Math.cos(aim)*12;inv=.5}if(/^Digit[1-4]$/.test(e.code)&&phase==="quiz")document.querySelectorAll("#quizbox button")[+e.code[5]-1]?.click()});
addEventListener("keyup",e=>keys[e.code]=false);addEventListener("blur",()=>{keys={};mouse.down=false});
const canvas=$("view");canvas.addEventListener("pointermove",e=>{let r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;let nx=(mouse.x/r.width-.5)*2,ny=(mouse.y/r.height-.5)*2;aim=Math.atan2(nx,1.4-ny)});
canvas.addEventListener("pointerdown",e=>{mouse.down=true});addEventListener("pointerup",()=>mouse.down=false);
})();
</script>
</body>
</html>
