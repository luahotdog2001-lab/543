.btn.opt.sel{border:2px solid var(--ac);background:var(--card)}

.qq{font-size:20px;font-weight:700;margin:4px 0 12px;line-height:1.4}

canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:none;cursor:crosshair}

function renderQ(box,title,cb){
  const q=Q[rnd(Q.length)],ch=shuf(q.slice(1));
  box.innerHTML="";
  if(title){const t=document.createElement("div");t.className="mut small";t.textContent=title;box.appendChild(t)}
  const h=document.createElement("div");h.className="qq";h.textContent=q[0];box.appendChild(h);
  let done=false;
  ch.forEach((c,i)=>{
    const b=document.createElement("button");b.className="btn opt";b.textContent=(i+1)+") "+c;
    b.onclick=()=>{if(done)return;done=true;const ok=c===q[1];b.classList.add(ok?"ok":"bad");cb(ok)};
    box.appendChild(b);
  });
}
function wait(box,text){box.innerHTML="";const p=document.createElement("div");p.className="qq";p.textContent=text;box.appendChild(p);push({rd:1})}
function startQuiz(){
  const box=$("qbox");

      const w=W[k],b=document.createElement("button");b.className="btn opt";b.textContent=w.n+" — "+w.t+" (피해 "+w.dmg+")";

    });
  },600));

// ===== 운영자 패널 (방장 전용) =====
const hasW=k=>Object.prototype.hasOwnProperty.call(W,k);
function applyAdm(d){
  if(d.cmd==="kick")return leave("방장이 당신을 내보냈어요.");
  if(d.cmd==="ban")return leave("이 방에서 영구 차단되었어요.");
  if(d.cmd==="w"&&hasW(d.w)){me.w=d.w;me.wl=1;push({});flash("🎁 운영자가 "+W[d.w].n+" 지급!")}
  if(d.cmd==="h"){me.hp=100;push({});flash("💚 운영자가 체력을 회복시켰어요!")}
  if(d.cmd==="msg")popup("📢 "+String(d.t||"").slice(0,80));
  if(d.cmd==="frz"){me.frz=cl(+d.s||3,0,10);flash("🧊 얼어붙었어요!")}
  if(d.cmd==="dmg"&&me.al){me.hp-=cl(+d.n||0,0,999);push({});if(me.hp<=0)die(null)}
}
const admRecv=m=>{const d=m.data;if(m.peer==="H"&&d&&myId&&(d.to===myId||d.to==="*"))applyAdm(d)};
const kk={};
function modKick(id,why){
  if(kk[id])return;kk[id]=1;setTimeout(()=>delete kk[id],3000);
  room.emit("adm",{to:id,cmd:why});setTimeout(()=>room&&room.kick&&room.kick(id),400);
}
function banScan(ps){
  const bl=banGet();if(!bl.length)return;
  for(const p of ps){if(p.isMe||p.kind!=="viewer")continue;const u=p.presence&&p.presence.u;if(u&&bl.some(b=>b.u===u))modKick(p.peer,"ban")}
}
let asig="";
function admRows(){
  const A=$("adm");if(!isHost||!DEV||!room||A.classList.contains("hide"))return;
  const ps=room.peers().filter(p=>p.kind==="viewer"),bl=banGet();
  const sig=ps.map(p=>p.peer+p.presence.n).join()+"|"+bl.map(b=>b.u).join()+phase;
  if(sig===asig)return;asig=sig;
  A.innerHTML="";
  const mk=(par,txt,fn)=>{const b=document.createElement("button");b.className="btn alt";b.style.cssText="padding:6px 9px;font-size:14px;margin:2px";b.textContent=txt;b.onclick=()=>{fn();b.blur()};par.appendChild(b)};
  const h=document.createElement("div");h.className="qq";h.textContent="🛠 운영자 패널";A.appendChild(h);
  ps.forEach(p=>{

    const t=document.createElement("span");t.style.flex="1 1 100%";t.textContent=chOf(p.presence.ch).n.split(" ")[0]+" "+nm+(p.isMe?" (나)":"");row.appendChild(t);
    const send=o=>p.isMe?applyAdm(o):room.emit("adm",Object.assign({to:p.peer},o));
    mk(row,"⚡번개창",()=>send({cmd:"w",w:"sup1"}));mk(row,"☄️메테오",()=>send({cmd:"w",w:"sup2"}));mk(row,"🌟천공포",()=>send({cmd:"w",w:"sup3"}));
    mk(row,"💚회복",()=>send({cmd:"h"}));
    if(!p.isMe){
      mk(row,"🚪내보내기",()=>{if(confirm(nm+" 님을 내보낼까요?"))modKick(p.peer,"kick")});
      mk(row,"⛔영구밴",()=>{
        if(!confirm(nm+" 님을 영구 차단할까요?"))return;
        const u=p.presence.u,b2=banGet();
        if(u&&!b2.some(b=>b.u===u)){b2.push({u,n:nm});banSet(b2)}
        modKick(p.peer,"ban");asig="";
      });
    }
    A.appendChild(row);
  });
  const g=document.createElement("div");g.style.marginTop="8px";
  if(phase==="fight")mk(g,"🏁 게임 종료",()=>setPhase("end"));
  if(phase!=="lobby")mk(g,"🔄 대기실로",()=>setPhase("lobby"));
  A.appendChild(g);
  const bt=document.createElement("div");bt.className="mut small";bt.style.marginTop="10px";bt.textContent="차단 목록 ("+bl.length+"명) — 이 브라우저에 저장돼요";A.appendChild(bt);
  bl.forEach(b=>{const r=document.createElement("div");r.className="pl";const sp=document.createElement("span");sp.style.flex="1";sp.textContent="⛔ "+String(b.n||"?");r.appendChild(sp);
    mk(r,"해제",()=>{banSet(banGet().filter(x=>x.u!==b.u));asig=""});A.appendChild(r)});

function drawLobby(ps){
  const v=ps.filter(p=>p.kind==="viewer"),sig=v.map(p=>p.peer+p.presence.n+p.presence.host+p.presence.ch).join()+mapKey();
  if(sig===lsig)return;lsig=sig;
  const L=$("plist");L.innerHTML="";
  v.forEach(p=>{const d=document.createElement("div");d.className="pl";const i=document.createElement("i");i.style.background=col(p.presence.c);
    const s=document.createElement("span");s.textContent=(p.presence.host?"👑 ":"")+chOf(p.presence.ch).n.split(" ")[0]+" "+(p.presence.n||"…")+(p.isMe&&p.sameTab?" (나)":"");d.append(i,s);L.appendChild(d)});
  $("cnt").textContent="· "+v.length+"명";buildMaps();
}
function drawEnd(ps){
  const v=ps.filter(p=>p.kind==="viewer").map(p=>({n:String(p.presence.n||"…"),k:p.presence.k|0,d:p.presence.d|0,c:p.presence.c,me:p.isMe&&p.sameTab})).sort((a,b)=>b.k-a.k||a.d-b.d);
  const sig=JSON.stringify(v);if(sig===esig)return;esig=sig;
  const L=$("board");L.innerHTML="";
  v.forEach((r,i)=>{const d=document.createElement("div");d.className="pl";const m=document.createElement("i");m.style.background=col(r.c);
    const s=document.createElement("span");s.textContent=(["🥇","🥈","🥉"][i]||(i+1)+"등")+" "+r.n+(r.me?" (나)":"")+" — "+r.k+"킬 / "+r.d+"데스";d.append(m,s);L.appendChild(d)});
}

// ===== 단계 전환 =====
function enter(p){
  phase=p;
  if(p==="lobby"){push({rd:0,k:0,d:0,hp:100,al:1});buildCh();buildMaps();lsig="";$("st").classList.toggle("hide",!isHost);$("lw").classList.toggle("hide",isHost);show("lobby")}
  else if(p==="quiz"){qStart=Date.now();push({rd:0,k:0,d:0,hp:100,w:"dagger",wl:1,al:1});show("quiz");startQuiz()}
  else if(p==="fight")startFight();
  else if(p==="end"){cancelAnimationFrame(raf);esig="";$("again").classList.toggle("hide",!isHost);$("ew").classList.toggle("hide",isHost);show("end")}
}
function tick(){
  if(!room)return;
  if(!myId){const m0=myPeer();if(m0)myId=m0.peer}
  const ps=room.peers(),host=ps.find(p=>p.presence&&p.presence.host);
  if(!host){if(++hostLost>20)return leave("방장이 나가서 방이 닫혔어요.")}else hostLost=0;
  if(host&&host.presence.seq!==curSeq){curSeq=host.presence.seq;enter(host.presence.phase)}
  if(phase==="lobby")drawLobby(ps);
  if(phase==="end")drawEnd(ps);
  if(isHost){
    banScan(ps);admRows();
    if(phase==="quiz"&&Date.now()-qStart>3000&&(ps.filter(p=>p.kind==="viewer").every(p=>p.presence.rd)||Date.now()-qStart>45000))setPhase("fight");
    if(phase==="fight"&&Date.now()-fightStart>FIGHT*1000)setPhase("end");
  }
}
setInterval(tick,150);

// ===== 전투 =====
function spawn(){let n=0;do{me.x=60+rnd(AW-120);me.y=60+rnd(AH-120)}while(inWall(me.x,me.y,PR+8)&&++n<40);me.hp=100;me.al=1;me.resp=0}
function startFight(){
  projs=[];items=[];MAP=MAPS[mapKey()];spawn();me.inv=2;me.cd=0;me.sk=0;me.ug=me.tf=me.fv=me.spd=me.dbo=me.slow=me.frz=me.psn=me.hid=me.dh=0;nextItem=performance.now()+4000;fightStart=Date.now();t0=last=performance.now();nextMq=t0+20000;
  $("mq").classList.add("hide");$("feed").textContent="";show("game");push({});
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function addProj(o,s){
  const w=W[s.w],L=LV[s.l|0]||LV[1];
  projs.push({o,x:s.x+Math.cos(s.a)*PR,y:s.y+Math.sin(s.a)*PR,vx:Math.cos(s.a)*w.sp,vy:Math.sin(s.a)*w.sp,r:w.r*L.r,dmg:w.dmg*chOf(s.ch).dm*(s.bo?1.8:1)*L.d,k:s.w,life:w.life,col:w.col,sw:s.w==="sword"});
}
function fire(){
  const w=W[me.w];if(!myId)return;me.cd=w.cd*chOf(me.ch).cd*(me.tf>0?.5:1)*(LV[me.wl|0]||LV[1]).c;
  const s={x:Math.round(me.x),y:Math.round(me.y),a:+me.a.toFixed(3),w:me.w,ch:me.ch,bo:me.dbo>0?1:0,l:me.wl};
  addProj(myId,s);
  room.emit("shot",s).catch(e=>{if(e&&e.code==="not_permitted"&&!warned){warned=true;$("feed").textContent="⚠️ 이 계정은 공격 권한이 없어요 (공유 권한을 확인하세요)"}});
}
function flash(t){$("feed").textContent=t;setTimeout(()=>{if($("feed").textContent===t)$("feed").textContent=""},1600)}
function hideMq(){$("mq").classList.add("hide");clearTimeout(mqT);nextMq=performance.now()+25000}
function showMq(){
  const b=$("mq");b.classList.remove("hide");
  renderQ(b,"🧠 보너스 퀴즈 (1~4 키) · 정답이면 HP +35",ok=>{
    if(ok){me.hp=Math.min(100,me.hp+35);flash("정답! HP +35 ❤️")}else flash("오답!");
    setTimeout(hideMq,600);
  });
  mqT=setTimeout(hideMq,9000);
}
const mapKey=()=>{const h=room&&room.peers().find(p=>p.presence&&p.presence.host);const k=h&&h.presence.map;return hasK(MAPS,k)?k:"plain"};
function buildMaps(){
  const L=$("maps");L.innerHTML="";
  const t=document.createElement("div");t.className="mut small";t.textContent=isHost?"맵 선택 (방장)":"맵 (방장이 골라요)";L.appendChild(t);
  const cur=mapKey();
  Object.keys(MAPS).forEach(k=>{const b=document.createElement("button");b.className="btn opt"+(cur===k?" sel":"");b.textContent=MAPS[k].n;
    if(isHost)b.onclick=()=>{room.presence({map:k});buildMaps()};else b.disabled=true;L.appendChild(b)});
}
function inWall(x,y,r){return MAP.w.some(([a,b,w,h])=>x>a-r&&x<a+w+r&&y>b-r&&y<b+h+r)}
function wallPush(){
  for(const [x,y,w,h] of MAP.w){
    const cx=cl(me.x,x,x+w),cy=cl(me.y,y,y+h),dx=me.x-cx,dy=me.y-cy,d=Math.hypot(dx,dy);
    if(d<PR){if(d===0)me.y=y-PR;else{me.x=cx+dx/d*PR;me.y=cy+dy/d*PR}}
  }
}
function spawnItem(ty){
  const ks=Object.keys(IT).concat(["orb"]);let x,y,n=0;
  do{x=60+rnd(AW-120);y=60+rnd(AH-120)}while(inWall(x,y,26)&&++n<40);
  const it={id:++iid,t:hasK(IT,ty)?ty:ks[rnd(ks.length)],x,y,life:20};items.push(it);
  room.emit("isp",{id:it.id,t:it.t,x,y}).catch(()=>{});
}
function useItem(it){
  const d=IT[it.t];
  if(it.t==="spd")me.spd=6;else if(it.t==="shd")me.inv=Math.max(me.inv,4);
  else if(it.t==="hp")me.hp=Math.min(100,me.hp+40);else if(it.t==="pow")me.dbo=8;else if(it.t==="orb"){orbUp();return}
  flash(d.e+" "+d.n+" 획득!");push({});
}
// ===== 개발자 모드 (H 키 + 비밀번호) =====
const DEVH="2ea9a67d08273dc96e92a26e2afe4788d3985dcc3e1483d955c08929589d610b";
let DEV=false,GOD=false,INF=false,dvFail=0,dvLock=0;
const sha=async t=>Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))).map(x=>x.toString(16).padStart(2,"0")).join("");
function devOpen(){$("dvp").value="";$("dvm").textContent="";$("dv").classList.remove("hide");$("dvp").focus()}
async function devTry(){
  if(Date.now()<dvLock){$("dvm").textContent="잠시 후 다시 시도해 주세요.";return}
  if(!(window.crypto&&crypto.subtle)){$("dvm").textContent="이 환경에서는 사용할 수 없어요.";return}
  if(await sha($("dvp").value)===DEVH){dvFail=0;$("dv").classList.add("hide");setDev(true)}
  else{if(++dvFail>=5){dvLock=Date.now()+30000;dvFail=0;$("dvm").textContent="5번 틀렸어요. 30초 뒤에 다시 시도하세요."}else $("dvm").textContent="비밀번호가 틀렸어요.";$("dvp").value=""}
}
function setDev(on){
  DEV=on;if(!on){GOD=INF=false;me.inv=0}
  $("dev").classList.toggle("hide",!on);if(on)buildDev();
  $("admb").classList.toggle("hide",!(isHost&&on&&room));if(!on)$("adm").classList.add("hide");
  flash(on?"🧪 개발자 모드 ON":"개발자 모드 OFF");
}
function buildDev(){
  const A=$("dev");A.innerHTML="";
  const mk=(txt,fn)=>{const b=document.createElement("button");b.className="btn alt";b.style.cssText="padding:6px 8px;font-size:13px;margin:2px";b.textContent=txt;b.onclick=()=>{fn();b.blur()};A.appendChild(b)};
  const h=document.createElement("div");h.className="mut small";h.style.marginBottom="4px";h.textContent="🧪 개발자 모드 · H 키로 끄기 · 게임 중에 사용";A.appendChild(h);
  mk((GOD?"✅":"⬜")+" 무적",()=>{GOD=!GOD;if(!GOD)me.inv=0;buildDev()});
  mk((INF?"✅":"⬜")+" 무한 능력/궁극기",()=>{INF=!INF;buildDev()});
  mk("💚 HP 100",()=>{me.hp=100;push({})});
  mk("✨ 궁극기 충전",()=>{me.ug=100});

  [["sup1","⚡"],["sup2","☄️"],["sup3","🌟"]].forEach(([k,e])=>mk(e+" 슈퍼무기",()=>{me.w=k;push({})}));

$("dvok").onclick=devTry;
$("dvno").onclick=()=>$("dv").classList.add("hide");
$("dvp").onkeydown=e=>{if(e.key==="Enter")devTry();else if(e.key==="Escape")$("dv").classList.add("hide")};
// ===== 능력 / 무기 레벨 / 명령어 =====
let pop={t:"",life:0};
const popup=t=>{pop.t=t;pop.life=3};
const wname=(k,l)=>{const w=W[k]||W.dagger,a=WN[k];return w.n.split(" ")[0]+" "+(a?a[cl(l|0,1,3)-1]:w.n.split(" ").slice(1).join(" "))+(l>1?" Lv."+l:"")};
function orbUp(){
  if(me.wl>=3){me.hp=Math.min(100,me.hp+25);popup("🔮 "+wname(me.w,3)+" 이미 최대 레벨! HP +25");push({});return}
  const a=wname(me.w,me.wl);me.wl++;popup("🔮 "+a+" ➜ "+wname(me.w,me.wl)+" 업그레이드!");flash("🔮 무기 구슬! Lv."+me.wl);push({});
}
function shoot(w,a){
  if(!room||!myId||phase!=="fight"||!me.al)return;
  const s={x:Math.round(me.x),y:Math.round(me.y),a:+a.toFixed(3),w,ch:me.ch,bo:me.dbo>0?1:0,l:1};
  addProj(myId,s);room.emit("shot",s).catch(()=>{});
}
const fan=(w,n,c,sp,dl)=>{for(let i=0;i<n;i++){const a=n===1?c:c-sp/2+i*sp/(sp>=6.28?n:n-1);dl?setTimeout(()=>shoot(w,a),dl*i):shoot(w,a)}};
const mv=(d)=>{me.x=cl(me.x+Math.cos(me.a)*d,PR,AW-PR);me.y=cl(me.y+Math.sin(me.a)*d,PR,AH-PR);wallPush()};
const SKF={
  fire:()=>fan("flame",8,0,6.283),
  wind:()=>{mv(160);me.inv=Math.max(me.inv,.4)},
  forest:()=>{me.hp=Math.min(100,me.hp+40)},
  water:()=>{me.inv=Math.max(me.inv,2.5)},
  thunder:()=>fan("bolt",3,me.a,.25,70),
  ice:()=>fan("shard",7,me.a,.9),
  poison:()=>fan("toxin",6,me.a,.7),
  shadow:()=>{mv(Math.min(300,Math.hypot(mouse.x-me.x,mouse.y-me.y)));me.inv=Math.max(me.inv,.5)},
  earth:()=>fan("rock",10,0,6.283),
  light:()=>fan("beam",6,me.a,0,60)
};
const ULF={
  fire:()=>fan("flame",24,0,6.283),
  wind:()=>{me.tf=5;me.inv=Math.max(me.inv,1.5)},
  forest:()=>{me.hp=100;me.fv=6},
  water:()=>{fan("wave",9,me.a,1.4);me.hp=Math.min(100,me.hp+20)},
  thunder:()=>{for(let k=0;k<3;k++)setTimeout(()=>fan("bolt",12,k*.26,6.283),k*400)},
  ice:()=>fan("icebl",12,0,6.283),
  poison:()=>fan("toxin",20,0,6.283),
  shadow:()=>{me.hid=5;me.dbo=Math.max(me.dbo,5);me.spd=Math.max(me.spd,5)},
  earth:()=>fan("bigrock",1,me.a,0),
  light:()=>{me.hp=100;me.inv=Math.max(me.inv,3);fan("beam",12,0,6.283)}
};
function skill(){
  if(!me.al||me.sk>0||me.frz>0||!myId||phase!=="fight")return;
  const c=me.ch;me.sk=chOf(c).sc||SKCD;(SKF[c]||SKF.fire)();
  flash(chOf(c).n+" 능력 발동!");push({});
}
function ult(){
  if(!me.al||me.ug<100||me.frz>0||!myId||phase!=="fight")return;
  me.ug=0;(ULF[me.ch]||ULF.fire)();flash("✨ 궁극기! "+UL[me.ch]);push({});
}
function roll(){
  if(!me.al||me.dh>0||me.frz>0||phase!=="fight")return;
  const dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dy=(keys.KeyS?1:0)-(keys.KeyW?1:0),a=(dx||dy)?Math.atan2(dy,dx):me.a;
  me.x=cl(me.x+Math.cos(a)*130,PR,AW-PR);me.y=cl(me.y+Math.sin(a)*130,PR,AH-PR);
  me.inv=Math.max(me.inv,.25);me.dh=4;wallPush();push({});
}
// --- 명령어 콘솔: / 키로 열기. 등급 0=누구나, 1=개발자 모드, 2=개발자 모드+방장

function runCmd(line){
  const raw=line.trim().replace(/^\//,""),a=raw.split(/\s+/),n=(a.shift()||"").toLowerCase(),c=hasK(CMDS,n)?CMDS[n]:null;
  if(!c)return"알 수 없는 명령어예요. /help";
  if(c.l>=1&&!DEV)return"🔒 개발자 모드(H 키 + 비밀번호)가 필요해요.";
  if(c.l===2&&!isHost)return"🔒 방장만 쓸 수 있어요.";
  if(!room&&n!=="help")return"방 안에서만 쓸 수 있어요.";
  try{return String(c.f(a,raw.slice(n.length).trim())||"")}catch(e){return"오류: "+e.message}
}
const cmdHist=[];let hi=0;

function openCmd(){$("cmdw").classList.remove("hide");$("cmd").value="/";$("cmd").focus();if(!$("cmdo").children.length)cmdLog("/help 로 명령어 보기 · 닫기: Esc 또는 빈 줄에서 Enter")}

$("cmd").onkeydown=e=>{

    const v=$("cmd").value.trim();if(!v||v==="/")return closeCmd();
    cmdHist.push(v);hi=cmdHist.length;cmdLog("> "+v);const r=runCmd(v);if(r){cmdLog(r);flash(r.split("\n")[0])}$("cmd").value="/";
  }
};
function die(killer){
  me.al=0;me.d++;me.resp=3;hideMq();

function update(dt,t){
  if(!myId){const m=myPeer();if(m)myId=m.peer}
  if(me.al){
    const dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dy=(keys.KeyS?1:0)-(keys.KeyW?1:0);
    if((dx||dy)&&me.frz<=0){const l=Math.hypot(dx,dy),sp=chOf(me.ch).sp*(me.spd>0?1.5:1)*(me.tf>0?1.6:1)*(me.slow>0?.5:1);me.x=cl(me.x+dx/l*sp*dt,PR,AW-PR);me.y=cl(me.y+dy/l*sp*dt,PR,AH-PR)}
    wallPush();me.a=Math.atan2(mouse.y-me.y,mouse.x-me.x);me.cd-=dt;me.inv-=dt;me.sk-=dt;me.spd-=dt;me.tf-=dt;me.fv-=dt;me.dbo-=dt;me.ug=Math.min(100,me.ug+3*dt);
    me.slow-=dt;me.frz-=dt;me.psn-=dt;me.hid-=dt;me.dh-=dt;
    if(me.psn>0){me.hp-=5*dt;if(me.hp<=0)die(null)}
    if(me.ch==="light")me.hp=Math.min(100,me.hp+2*dt);
    if(DEV){if(GOD)me.inv=Math.max(me.inv,1);if(INF){me.sk=0;me.ug=100}}
    if(keys.Space&&!mouse.down){let bd=1e9,tg=null;
      for(const p of room.peers()){if(p.isMe||p.kind!=="viewer"||!p.presence.al)continue;
        const d=Math.hypot(p.presence.x-me.x,p.presence.y-me.y);if(d<bd){bd=d;tg=p.presence}}
      if(tg)me.a=Math.atan2(tg.y-me.y,tg.x-me.x)}
    if((mouse.down||keys.Space)&&me.cd<=0&&me.frz<=0)fire();
  }else{me.resp-=dt;if(me.resp<=0){spawn();me.inv=1.5;push({})}}
  if(me.al&&me.inv<=0&&MAP.hz.some(([x,y,w,h])=>me.x>x&&me.x<x+w&&me.y>y&&me.y<y+h)){me.hp-=12*dt;if(me.hp<=0)die(null)}
  if(isHost&&t>nextItem&&items.length<5){spawnItem();nextItem=t+6000+rnd(4000)}
  for(const it of items)it.life-=dt;
  items=items.filter(i=>i.life>0);
  if(me.al)for(const it of items.slice())if(Math.hypot(it.x-me.x,it.y-me.y)<PR+16){useItem(it);items=items.filter(i=>i!==it);room.emit("itk",{id:it.id}).catch(()=>{})}
  for(const p of projs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(MAP.w.some(([x,y,w,h])=>p.x>x&&p.x<x+w&&p.y>y&&p.y<y+h))p.life=0;
    if(me.al&&me.inv<=0&&myId&&p.o!==myId&&p.life>0&&Math.hypot(p.x-me.x,p.y-me.y)<PR+p.r){
      p.life=0;me.hp-=p.dmg*chOf(me.ch).tk*(me.fv>0?.4:1);me.ug=Math.min(100,me.ug+8);const kw=W[p.k];if(kw){if(kw.sl)me.slow=2;if(kw.fz)me.frz=kw.fz;if(kw.ps)me.psn=3}if(me.hp<=0)die(p.o);
    }}
  projs=projs.filter(p=>p.life>0&&p.x>-50&&p.x<AW+50&&p.y>-50&&p.y<AH+50);
  pop.life-=dt;
  if(t-pAt>50){pAt=t;push({})}
  if(t>nextMq&&me.al&&$("mq").classList.contains("hide"))showMq();
  $("h1").textContent="❤️ "+Math.max(0,Math.round(me.hp))+"  ·  ⚔️ "+me.k+"킬";
  $("h2").textContent="⏱ "+Math.max(0,Math.ceil(FIGHT-(t-t0)/1000))+"초";
  $("h3").textContent=wname(me.w,me.wl)+" · "+chOf(me.ch).n+(me.sk>0?" (E "+Math.ceil(me.sk)+"초)":" (E 준비!)")+(me.dh>0?" ⇧"+Math.ceil(me.dh):" ⇧")+(DEV?" 🧪":"");
}
function drawPlayer(q,self){
  const x=+q.x,y=+q.y;if(!isFinite(x)||!isFinite(y))return;
  ctx.save();ctx.globalAlpha=self?(me.hid>0?.4:me.inv>0?.5:1):(q.hd?.1:1);
  ctx.fillStyle=col(q.c);ctx.beginPath();ctx.arc(x,y,PR,0,7);ctx.fill();
  if(self){ctx.lineWidth=3;ctx.strokeStyle="#fff";ctx.stroke()}
  if(self){const bf=me.tf>0?"#a7f3d0":me.fv>0?"#4ade80":me.dbo>0?"#fb7185":me.spd>0?"#fde047":null;
    if(bf){ctx.strokeStyle=bf;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,PR+11,0,7);ctx.stroke()}}
  if((self&&me.inv>0)||q.sh){ctx.lineWidth=3;ctx.strokeStyle="#7dd3fc";ctx.beginPath();ctx.arc(x,y,PR+6,0,7);ctx.stroke()}
  ctx.font="22px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  const w=W[q.w]||W.dagger,a=+q.a||0;ctx.font="16px sans-serif";ctx.fillText(chOf(q.ch).n.split(" ")[0],x,y+1);ctx.font="22px sans-serif";
  ctx.fillText(w.n.split(" ")[0],x+Math.cos(a)*30,y+Math.sin(a)*30);
  ctx.font="bold 13px sans-serif";ctx.fillStyle="#fff";ctx.fillText(String(q.n||"").slice(0,8),x,y-PR-18);
  const hp=cl((+q.hp||0)/100,0,1);ctx.fillStyle="#0008";ctx.fillRect(x-20,y-PR-10,40,5);
  ctx.fillStyle=hp>.5?"#22c55e":hp>.25?"#f59e0b":"#ef4444";ctx.fillRect(x-20,y-PR-10,40*hp,5);
  ctx.restore();
}
function draw(){
  ctx.fillStyle=MAP.bg;ctx.fillRect(0,0,AW,AH);
  ctx.strokeStyle=MAP.gl;ctx.lineWidth=1;ctx.beginPath();
  for(let i=50;i<AW;i+=50){ctx.moveTo(i,0);ctx.lineTo(i,AH)}for(let j=50;j<AH;j+=50){ctx.moveTo(0,j);ctx.lineTo(AW,j)}ctx.stroke();
  ctx.fillStyle="rgba(220,38,38,.35)";for(const [x,y,w,h] of MAP.hz)ctx.fillRect(x,y,w,h);
  ctx.fillStyle=MAP.wc;for(const [x,y,w,h] of MAP.w){ctx.fillRect(x,y,w,h);ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=2;ctx.strokeRect(x,y,w,h)}
  for(const it of items){const d=IT[it.t],pu=1+.15*Math.sin(performance.now()/200);ctx.fillStyle=d.c+"55";ctx.beginPath();ctx.arc(it.x,it.y,20*pu,0,7);ctx.fill();ctx.font="24px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(d.e,it.x,it.y+1)}
  ctx.strokeStyle="#4f6bff";ctx.lineWidth=4;ctx.strokeRect(2,2,AW-4,AH-4);
  for(const p of room.peers()){
    if(p.kind!=="viewer")continue;
    const self=p.isMe&&p.sameTab,q=self?me:p.presence;
    if(q&&q.x!=null&&q.al)drawPlayer(q,self);
  }
  for(const p of projs){ctx.fillStyle=p.col;ctx.globalAlpha=p.sw?.6:1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1}
  if(pop.life>0){ctx.save();ctx.globalAlpha=Math.min(1,pop.life);ctx.font="bold 22px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";const tw=ctx.measureText(pop.t).width+40;ctx.fillStyle="#000b";ctx.fillRect(AW/2-tw/2,50,tw,44);ctx.fillStyle="#fff";ctx.fillText(pop.t,AW/2,72);ctx.restore()}
  ctx.fillStyle="#0008";ctx.fillRect(10,AH-24,200,12);ctx.fillStyle=me.ug>=100?"#facc15":"#60a5fa";ctx.fillRect(10,AH-24,2*me.ug,12);
  ctx.fillStyle="#fff";ctx.font="bold 12px sans-serif";ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.fillText(me.ug>=100?"Q 궁극기 준비! "+UL[me.ch]:"궁극기 "+Math.floor(me.ug)+"%",12,AH-30);
  if(!me.al){ctx.fillStyle="#000a";ctx.fillRect(0,0,AW,AH);ctx.fillStyle="#fff";ctx.font="bold 36px sans-serif";ctx.textAlign="center";
    ctx.fillText("💥 쓰러졌어요! "+Math.max(1,Math.ceil(me.resp))+"초 뒤 부활",AW/2,AH/2)}
}
function loop(t){
  if(phase!=="fight")return;
  const dt=Math.min(.05,(t-last)/1000);last=t;update(dt,t);draw();raf=requestAnimationFrame(loop);
}

function wire(){
  offs=[
    room.on("shot",m=>{const d=m.data;if(m.sameTab||phase!=="fight"||!d||!W[d.w]||!isFinite(d.x)||!isFinite(d.y)||!isFinite(d.a))return;addProj(m.peer,d)}),
    room.on("kill",m=>{if(m.data&&myId&&m.data.to===myId&&phase==="fight"){me.k++;me.ug=Math.min(100,me.ug+30);if(me.ch==="poison")me.hp=Math.min(100,me.hp+20);push({});flash("💪 KO! +1킬")}}),
    room.on("adm",admRecv),
    room.on("isp",m=>{const d=m.data;if(m.sameTab||m.peer!=="H"||phase!=="fight"||!d||!hasK(IT,d.t)||!isFinite(d.x)||!isFinite(d.y))return;items.push({id:d.id,t:d.t,x:d.x,y:d.y,life:20})}),
    room.on("itk",m=>{const d=m.data;if(m.sameTab||!d)return;items=items.filter(i=>i.id!==d.id)})
  ];
}
async function leave(text){
  offs.forEach(f=>f());offs=[];cancelAnimationFrame(raf);
  if(room){try{await room.leave()}catch(e){}}
  room=null;isHost=false;myId=null;curSeq=-1;$("admb").classList.add("hide");$("adm").classList.add("hide");phase="lobby";me=fresh();show("home");msg(text||"");
}
async function enterRoom(c,host){
  const nick=($("nick").value.trim().slice(0,8))||("용사"+(1+rnd(99)));
  msg("연결 중…");
  try{room=await R.join("eng-"+c,host)}catch(e){
    room=null;const ty=e&&e.type;
    if(host&&ty==="unavailable-id")return enterRoom(newCode(),true);
    return msg(ty==="peer-unavailable"?"그런 방이 없어요. 코드를 다시 확인해 주세요.":"연결에 실패했어요. 인터넷 연결을 확인하고 다시 시도하세요.");
  }
  if(host){
    await room.presence({host:1,phase:"lobby",seq:0});seq=0;await sleep(900);
    if(room.peers().some(p=>p.presence.host&&!p.isMe)){try{await room.leave()}catch(e){}room=null;return enterRoom(newCode(),true)}
  }else{
    let h=null;for(let i=0;i<30&&!h;i++){await sleep(100);h=room.peers().find(p=>p.presence.host)}
    if(!h){try{await room.leave()}catch(e){}room=null;return msg("그런 방이 없어요. 코드를 다시 확인해 주세요.")}
    if(h.presence.phase!=="lobby"){try{await room.leave()}catch(e){}room=null;return msg("이미 게임이 진행 중인 방이에요.")}
  }
  isHost=host;me=fresh();me.n=nick;me.c=rnd(8);curSeq=-1;phase="lobby";hostLost=0;warned=false;
  $("rc").textContent=c.toUpperCase();wire();push({});show("lobby");msg("");$("admb").classList.toggle("hide",!(host&&DEV));
  $("st").classList.toggle("hide",!host);$("lw").classList.toggle("hide",host);
}

const newCode=()=>Array.from({length:4},()=>ALPHA[rnd(ALPHA.length)]).join("");
$("mk").onclick=()=>enterRoom(newCode(),true);
$("jn").onclick=()=>{const c=$("code").value.trim().toLowerCase();if(!/^[a-z0-9]{4}$/.test(c))return msg("방 코드는 4자리예요.");enterRoom(c,false)};
$("st").onclick=()=>{if(isHost)setPhase("quiz")};
$("again").onclick=()=>{if(isHost)setPhase("lobby")};
$("lv").onclick=$("lv2").onclick=()=>leave("");

// ===== 네트워크: PeerJS(WebRTC) 기반 방. 방장이 중계 서버 역할을 해요 =====
const PRE="engbattle-";
R={join:(name,host)=>new Promise((res,rej)=>{
  const code=name.replace("eng-","");
  const peer=host?new Peer(PRE+code):new Peer();
  const H={},conns={};let pres={},list=[],mine={},myId=host?"H":null,conn=null,bt=0;
  const timer=setTimeout(()=>{rej({type:"timeout"});try{peer.destroy()}catch(e){}},9000);
  const fire=(topic,d,from)=>(H[topic]||[]).forEach(f=>f({topic,data:d,peer:from,sameTab:from===myId,isMe:from===myId,kind:"viewer"}));
  const snap=()=>Object.keys(pres).map(k=>[k,pres[k]]);
  const bcast=()=>{if(bt)return;bt=setTimeout(()=>{bt=0;const m={t:"s",l:snap()};Object.values(conns).forEach(c=>c.open&&c.send(m))},40)};
  const hostEmit=(from,topic,data)=>{const m={t:"e",from,topic,data};Object.values(conns).forEach(c=>c.open&&c.send(m));fire(topic,data,from)};
  const room={
    presence:p=>{Object.assign(mine,p);
      if(host){pres.H=Object.assign({},mine);bcast()}else if(conn&&conn.open)conn.send({t:"p",p});
      return Promise.resolve()},
    peers:()=>{
      const out=(host?snap():list).map(([id,p])=>({peer:id,isMe:id===myId,sameTab:id===myId,kind:"viewer",presence:id===myId?mine:p}));
      if(myId&&!out.some(o=>o.isMe))out.push({peer:myId,isMe:true,sameTab:true,kind:"viewer",presence:mine});
      return out},
    emit:(topic,data)=>{if(host)hostEmit("H",topic,data);else if(conn&&conn.open)conn.send({t:"e",topic,data});return Promise.resolve()},
    on:(topic,fn)=>{(H[topic]=H[topic]||[]).push(fn);return()=>{H[topic]=H[topic].filter(f=>f!==fn)}},
    kick:id=>{const c=conns[id];if(c){try{c.close()}catch(e){}delete conns[id];delete pres[id];bcast()}},
    leave:()=>{try{peer.destroy()}catch(e){}return Promise.resolve()}
  };
  peer.on("error",e=>{clearTimeout(timer);rej(e)});
  if(host){
    peer.on("open",()=>{clearTimeout(timer);pres.H={};res(room)});
    peer.on("connection",c=>{
      conns[c.peer]=c;
      c.on("open",()=>{pres[c.peer]=pres[c.peer]||{};bcast()});
      c.on("data",m=>{
        if(!m)return;
        if(m.t==="p"&&m.p&&typeof m.p==="object"){delete m.p.host;delete m.p.phase;delete m.p.seq;pres[c.peer]=Object.assign(pres[c.peer]||{},m.p);bcast()}
        else if(m.t==="e"&&typeof m.topic==="string")hostEmit(c.peer,m.topic,m.data);
      });
      c.on("close",()=>{delete conns[c.peer];delete pres[c.peer];bcast()});
    });
  }else{
    peer.on("open",id=>{
      myId=id;conn=peer.connect(PRE+code,{reliable:true});
      conn.on("open",()=>{clearTimeout(timer);res(room)});
      conn.on("data",m=>{if(!m)return;if(m.t==="s")list=m.l;else if(m.t==="e")fire(m.topic,m.data,m.from)});
      conn.on("close",()=>{list=[]});
    });
  }
})};
if(!window.Peer)msg("인터넷 연결이 필요해요. (PeerJS를 불러오지 못했어요) 새로고침해 보세요.");
else{$("mk").disabled=$("jn").disabled=false;msg("")}
})();
</script>
